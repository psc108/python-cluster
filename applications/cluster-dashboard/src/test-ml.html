<!DOCTYPE html>
<html>
<head>
    <title>ML Test</title>
</head>
<body>
    <h1>ML Function Test</h1>
    <button onclick="testMLStatus()">Test ML Status</button>
    <button onclick="testMLAnalytics()">Test ML Analytics</button>
    <div id="result"></div>
    
    <script>
        async function testMLStatus() {
            try {
                const response = await fetch('/api/cluster.php?action=get_ml_status');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
        
        function testMLAnalytics() {
            alert('ML Analytics function called successfully!');
        }
        
        // Test if functions are globally accessible
        window.showMLAnalyticsModal = function() {
            alert('ML Analytics Modal - Working!');
        };
        
        window.showCreateMLPolicyModal = function() {
            alert('Create ML Policy Modal - Working!');
        };
    </script>
</body>
</html>
