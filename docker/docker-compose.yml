version: '3.8'

services:
  node1:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cluster-node-1
    environment:
      - NODE_ID=1
      - NODE_PORT=8000
      - CLUSTER_SIZE=3
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
    ports:
      - "8001:8000"
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  node2:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cluster-node-2
    environment:
      - NODE_ID=2
      - NODE_PORT=8000
      - CLUSTER_SIZE=3
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
    ports:
      - "8002:8000"
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  node3:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cluster-node-3
    environment:
      - NODE_ID=3
      - NODE_PORT=8000
      - CLUSTER_SIZE=3
      - CLUSTER_NODES=node1:8000,node2:8000,node3:8000
    ports:
      - "8003:8000"
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16